# ═══════════════════════════════════════════════════════════════════════════
# SD Cosmétique — format de sortie du scraper Tampermonkey
# Cible : table public.products (supabase/migrations/20260504013000_create_products.sql
#         + 20260506010000_add_stock_and_results_to_products.sql)
# ═══════════════════════════════════════════════════════════════════════════

[meta]
source_url    = "https://exemple-boutique.com/collections/soins"
scraped_at    = 2026-08-03T14:32:00Z   # datetime TOML natif (pas une string)
scraper       = "sdc-scraper"
version       = "1.0.0"
count         = 2                       # nombre d'entrées [[products]]
currency      = "XOF"                   # prix stockés en entier, sans décimale


# ───────────────────────────────────────────────────────────────────────────
# Un bloc [[products]] par produit. Ordre des clés libre.
# ───────────────────────────────────────────────────────────────────────────
[[products]]

# ── Identité (obligatoire) ────────────────────────────────────────────────
id    = "gel-douche-karite"       # text, PRIMARY KEY — slug stable, [a-z0-9-]
slug  = "gel-douche-karite"       # text, UNIQUE — utilisé dans l'URL /produit/<slug>
name  = "Gel Douche au Beurre de Karité"

# category : une valeur parmi
#   body | face | gammes | kits | duo | kit-levre | minceur
category = "body"

# ── Prix (entiers, en francs CFA — jamais de float) ───────────────────────
price          = 12000            # int, obligatoire
original_price = 15000            # int, optionnel — prix barré ; omettre si pas de promo

# ── Médias ────────────────────────────────────────────────────────────────
# URLs absolues. La première image est la vignette.
images = [
  "https://exemple-boutique.com/img/gel-douche-1.jpg",
  "https://exemple-boutique.com/img/gel-douche-2.jpg",
]

# ── Teints compatibles ────────────────────────────────────────────────────
# Valeurs autorisées uniquement : noir | marron | marron-clair | clair | metisse
# (src/shared/types/domain.type.ts:3)
skin_tones = ["noir", "marron", "marron-clair"]

# ── Badges affichés sur la carte produit ──────────────────────────────────
# Texte libre court, ex. "Nouveau", "Bio", "-20%", "Édition limitée"
badges = ["Bio", "Best-seller"]

# ── Notation ──────────────────────────────────────────────────────────────
rating       = 4.5                # numeric(3,1) — 0.0 à 5.0, une décimale max
review_count = 128                # int

# ── Contenus rédactionnels ────────────────────────────────────────────────
short_description = "Nettoie en douceur et nourrit intensément."

# Chaînes multi-lignes : utiliser les triples guillemets TOML
description = """
Formulé à partir de beurre de karité brut, ce gel douche nettoie sans agresser
la barrière cutanée.

Convient aux peaux sèches et sensibles.
"""

benefits = [
  "Hydrate pendant 24 h",
  "Sans sulfates",
  "Parfum naturel vanille",
]

usage = """
Appliquer sur peau humide, faire mousser, rincer abondamment.
Utilisation quotidienne.
"""

ingredients = "Aqua, Butyrospermum Parkii Butter, Glycerin, Coco-Glucoside, Parfum"

# ── Section « Résultats » de la fiche produit (optionnel) ─────────────────
results_title    = "Des résultats visibles"
results_subtitle = "Après 4 semaines d'utilisation quotidienne"

# ── Stock & mise en avant ─────────────────────────────────────────────────
in_stock            = true
stock_qty           = 42          # int, optionnel — omettre si inconnu
low_stock_threshold = 5           # int, optionnel — défaut applicatif : 5
is_new              = false
is_bestseller       = true


# ───────────────────────────────────────────────────────────────────────────
# Exemple minimal : uniquement les champs NOT NULL
# ───────────────────────────────────────────────────────────────────────────
[[products]]
id       = "masque-argile-verte"
slug     = "masque-argile-verte"
name     = "Masque Argile Verte"
category = "face"
price    = 8500
