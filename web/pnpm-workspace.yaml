# pnpm settings for ./web. sharp and unrs-resolver must run postinstall
# (Next image optimiser and the eslint/next resolver). Without these
# allowBuilds entries, pnpm >= 10.16 fails with ERR_PNPM_IGNORED_BUILDS.

allowBuilds:
  sharp: true
  unrs-resolver: true

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
